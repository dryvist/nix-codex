name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@8f24a5f8fbc3007cb80a2e9a088df89566ae1307 # v1.16.0
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@8f24a5f8fbc3007cb80a2e9a088df89566ae1307 # v1.16.0
    with:
      runner_label: macos-latest
      all_systems: false
