name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@41ca3a7c0f8853acbfa38ef905a6231cdddf968d # v1.19.0
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@41ca3a7c0f8853acbfa38ef905a6231cdddf968d # v1.19.0
    with:
      runner_label: macos-latest
      all_systems: false
