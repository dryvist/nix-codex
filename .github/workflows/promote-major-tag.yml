---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@8f24a5f8fbc3007cb80a2e9a088df89566ae1307 # v1.16.0
    with:
      tag: ${{ github.event.release.tag_name }}
